appId: com.projectx.flashtool

productName: Project X Flashtool v1

directories:
  output: release

files:
  - dist/**
  - dist-electron/**
  - platform-tools/**

artifactName: "${productName}-${version}-${os}.${ext}"

win:
  target:
    - nsis

linux:
  target:
    - AppImage
    - deb

mac:
  target:
    - dmg
