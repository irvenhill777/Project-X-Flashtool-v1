name: Project X Flashtool v1

on:
  push:
    branches:
      - main
      - release/**
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: "Project X Flashtool v1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Dependencies
        run: npm install

      - name: Build Vite App
        run: npm run build

      - name: Build Electron Application
        run: npm run dist

      - name: Show Generated Files
        run: |
          echo "==== RELEASE FILES ===="
          find . -type f | grep -E '\.(exe|msi|dmg|deb|AppImage)$' || true

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Project-X-Flashtool-v1-Windows
          path: |
            release/*.exe
            release/*.msi
          if-no-files-found: ignore

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Project-X-Flashtool-v1-Linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Project-X-Flashtool-v1-macOS
          path: |
            release/*.dmg
          if-no-files-found: ignore

      - name: Create Version Tag
        id: version
        run: |
          echo "tag=v1.${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Project X Flashtool v1
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.msi
            release/*.AppImage
            release/*.deb
            release/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
